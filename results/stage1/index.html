const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;
const crs=L.extend({},L.CRS.Simple,{transformation:new L.Transformation(512/190,24.5*512/190,-512/190,170.5*512/190)});
const map=L.map('map',{crs,minZoom:-1,maxZoom:7,zoomSnap:.25,preferCanvas:true}).setView([76,70],1);
const Tiles=L.TileLayer.extend({getTileUrl(c){const relative=`tiles/overworld_64k/${c.z}/${c.y}/${c.x}.webp`;return c.z<=DATA.offline_zoom?'assets/'+relative:DATA.tile_url.replace('{z}',c.z).replace('{y}',c.y).replace('{x}',c.x)}});
new Tiles('',{tileSize:512,minZoom:-1,minNativeZoom:0,maxNativeZoom:7,noWrap:true,bounds:[[-18.5,-24.5],[170.5,165.5]],attribution:'Map: Joric / Unlicense'}).addTo(map);
const group=L.featureGroup().addTo(map), colors=['#f8cb75','#76ded0','#c7a1f0','#fa9c8a','#9ed776','#88baf4'];
const select=document.getElementById('part'), search=document.getElementById('search'), list=document.getElementById('list');
DATA.parts.forEach(p=>{const o=document.createElement('option');o.value=p.part;o.textContent=`P${p.part.toString().padStart(2,'0')} · ${p.title}`;select.append(o)});
const initialPart=new URLSearchParams(location.search).get('p');if(DATA.parts.some(p=>String(p.part)===initialPart))select.value=initialPart;
document.getElementById('coverage').innerHTML=DATA.parts.map(p=>`<div>P${p.part.toString().padStart(2,'0')} · ${p.reviewed?`已审核 ${p.visits} 段`:p.download_status==='complete'?'已下载，待审核':'待下载'}</div>`).join('');
const visits=DATA.levels.reduce((n,l)=>n+l.visits.length,0), reviewed=DATA.parts.filter(p=>p.reviewed).length;
document.getElementById('counts').textContent=`${DATA.levels.length} 关 · ${visits} 次访问 · ${reviewed}/${DATA.parts.length} P`;
document.getElementById('unresolved').hidden=!DATA.unknown_events.length;
document.getElementById('unknowns').innerHTML=DATA.unknown_events.map(e=>`<div class="visit"><a href="https://www.bilibili.com/video/${encodeURIComponent(DATA.bvid)}/?p=${e.part}&t=${Math.floor(e.puzzle_start_time)}" target="_blank" rel="noopener">P${e.part} ${clock(e.puzzle_start_time)}–${clock(e.puzzle_end_time)}</a><small>身份未确认；暂不放置地图标记。</small></div>`).join('');
function visible(){const q=search.value.trim().toLowerCase(),p=Number(select.value);return DATA.levels.map(l=>({...l,shown:l.visits.filter(v=>!p||v.part===p)})).filter(l=>l.shown.length&&(!q||`${l.level_id} ${l.area}`.toLowerCase().includes(q)))}
function popup(level){return `<div class="popup-title">${escapeHTML(level.level_id)}</div><div class="status">${escapeHTML(level.area)} · ${level.entries.map(m=>m.coordinates.join(', ')).join(' / ')}</div>${level.preview?`<img src="${escapeHTML(level.preview)}" alt="${escapeHTML(level.level_id)} 参考布局" width="240" height="135" style="width:100%;height:auto;margin-top:8px;border-radius:4px">`:''}${level.shown.map(v=>`<div class="visit"><a href="${escapeHTML(v.url)}" target="_blank" rel="noopener">▶ P${v.part.toString().padStart(2,'0')} · ${clock(v.start)}–${clock(v.end)}</a><small>时间边界约 ±${escapeHTML(v.uncertainty??'待核查')} 秒</small></div>`).join('')}<p><a href="${escapeHTML(level.map_url)}" target="_blank" rel="noopener">在 Joric 原地图查看 ↗</a></p>`}
function markerRadius(){return Math.max(2,Math.min(6,3+map.getZoom()))}
map.on('zoomend',()=>group.eachLayer(m=>{m.setRadius(markerRadius());m.setStyle({weight:map.getZoom()<1?1:2})}));
function render(){group.clearLayers();list.replaceChildren();const levels=visible();document.getElementById('status').textContent=`显示 ${levels.length} 关；拖动 / 滚轮缩放，点击标记打开视频链接。`;
levels.forEach(level=>{const markers=level.entries.map(m=>L.circleMarker([m.coordinates[1],m.coordinates[0]],{radius:markerRadius(),color:'#101b20',weight:map.getZoom()<1?1:2,fillColor:colors[(level.shown[0].part-1)%colors.length],fillOpacity:.95}).bindTooltip(level.level_id).bindPopup(popup(level),{maxHeight:300,autoPanPadding:[18,18]}).addTo(group));const button=document.createElement('button');button.className='entry';button.innerHTML=`<strong>${escapeHTML(level.level_id)}</strong><small>${level.shown.map(v=>`P${v.part.toString().padStart(2,'0')} ${clock(v.start)}`).join(' · ')}</small>`;button.onclick=()=>{const marker=markers[0];map.setView(marker.getLatLng(),Math.max(map.getZoom(),4),{animate:false});marker.openPopup();revealMap()};list.append(button)});
if(!levels.length)list.innerHTML='<div class="empty">没有匹配的已确认关卡。</div>';}
function revealMap(){if(window.matchMedia('(max-width:760px)').matches)window.scrollTo({top:0,behavior:'smooth'})}
function fit(){if(group.getLayers().length)map.fitBounds(group.getBounds(),{padding:[35,35],maxZoom:4,animate:false});revealMap()}
search.addEventListener('input',render);select.addEventListener('change',()=>{render();fit()});document.getElementById('fit').onclick=fit;document.getElementById('world').onclick=()=>{map.fitBounds([[-18.5,-24.5],[170.5,165.5]],{animate:false});revealMap()};render();fit();
// A small, read-only QA surface also lets a future agent inspect exact layer counts.
window.atlas={data:DATA,map,group,visible};
</script>
