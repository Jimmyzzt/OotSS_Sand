name: Local tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run ruff check ootss tests scripts
      - run: uv run ruff format --check ootss tests scripts
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check ootss/templates/atlas.js
      - run: node --test deployment/worker.test.js
